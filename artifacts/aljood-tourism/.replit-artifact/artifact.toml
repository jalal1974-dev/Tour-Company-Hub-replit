kind = "web"
previewPath = "/"
title = "Al Jood Travel & Tourism"
version = "1.0.0"
id = "artifacts/aljood-tourism"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25491

[services.development]
run = "pnpm --filter @workspace/aljood-tourism run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aljood-tourism", "run", "build" ]
publicDir = "artifacts/aljood-tourism/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25491"
BASE_PATH = "/"
